<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#15171d"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343a48"/>
      <stop offset="100%" stop-color="#21252f"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowApp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Body (macOS standard 824x824 centered inside 1024x1024) -->
  <g filter="url(#shadowApp)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)"/>
    <!-- Outer Inset Border -->
    <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.12"/>
    <!-- Top Highlight Bevel -->
    <path d="M 285 102 L 739 102" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.22"/>
  </g>

  <!-- Studio Setlist Cards Stack -->
  <g filter="url(#cardShadow)">
    <!-- Back Card (Subtle Offset) -->
    <rect x="220" y="240" width="584" height="540" rx="36" fill="#1b1e26" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" transform="rotate(-3 512 510)"/>

    <!-- Front Card -->
    <rect x="220" y="240" width="584" height="540" rx="36" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.14"/>
  </g>

  <!-- Front Card Content -->
  <g>
    <!-- Card Header: Musical Note Emblem + Setlist Title -->
    <!-- Musical Clef / Beamed Notes -->
    <g filter="url(#glyphGlow)">
      <!-- Beamed Eighth Notes -->
      <ellipse cx="320" cy="400" rx="36" ry="26" fill="url(#accentGrad)" transform="rotate(-20 320 400)"/>
      <ellipse cx="440" cy="360" rx="36" ry="26" fill="url(#accentGrad)" transform="rotate(-20 440 360)"/>
      <!-- Stems -->
      <rect x="344" y="250" width="12" height="150" rx="6" fill="url(#accentGrad)"/>
      <rect x="464" y="210" width="12" height="150" rx="6" fill="url(#accentGrad)"/>
      <!-- Beam -->
      <polygon points="344,250 476,210 476,236 344,276" fill="url(#accentGrad)"/>
    </g>

    <!-- Header Tempo Badge -->
    <rect x="620" y="290" width="120" height="42" rx="21" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="680" y="318" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">SETLIST</text>

    <!-- Setlist Rows (Service Running Order representation) -->
    <!-- Row 1: Active Playing / Featured Item -->
    <g transform="translate(268, 470)">
      <rect x="0" y="0" width="488" height="64" rx="14" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
      <!-- Position Indicator -->
      <circle cx="32" cy="32" r="14" fill="#38bdf8"/>
      <text x="32" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">1</text>
      <!-- Track Title Bar -->
      <rect x="66" y="22" width="220" height="12" rx="6" fill="#f8fafc" fill-opacity="0.95"/>
      <!-- Key & BPM Pill -->
      <rect x="380" y="18" width="92" height="28" rx="8" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="426" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">74 BPM</text>
    </g>

    <!-- Row 2: Second Setlist Item -->
    <g transform="translate(268, 552)">
      <rect x="0" y="0" width="488" height="60" rx="14" fill="#1e222d" fill-opacity="0.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="32" cy="30" r="14" fill="#475569" fill-opacity="0.4"/>
      <text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">2</text>
      <rect x="66" y="24" width="260" height="12" rx="6" fill="#94a3b8" fill-opacity="0.7"/>
      <rect x="396" y="16" width="76" height="28" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <text x="434" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">D♯ maj</text>
    </g>

    <!-- Row 3: Third Setlist Item -->
    <g transform="translate(268, 630)">
      <rect x="0" y="0" width="488" height="60" rx="14" fill="#1e222d" fill-opacity="0.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
      <circle cx="32" cy="30" r="14" fill="#475569" fill-opacity="0.4"/>
      <text x="32" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#94a3b8" text-anchor="middle">3</text>
      <rect x="66" y="24" width="190" height="12" rx="6" fill="#94a3b8" fill-opacity="0.5"/>
      <rect x="396" y="16" width="76" height="28" rx="8" fill="#ffffff" fill-opacity="0.06"/>
      <text x="434" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">A min</text>
    </g>
  </g>
</svg>
